version: "3"

services:
  ai-novel:
    build: .
    container_name: ai-novel
    ports:
      - "27001:7860"
    volumes:
      - /share/CACHEDEV1_DATA/Container/ainovel/data:/app/data
      - /share/CACHEDEV1_DATA/Container/ainovel/logs:/app/logs
      - /share/CACHEDEV1_DATA/Container/ainovel/output:/app/output
      - /share/CACHEDEV1_DATA/Container/ainovel/cache:/app/cache
      - /share/CACHEDEV1_DATA/Container/ainovel/backups:/app/backups
      - /share/CACHEDEV1_DATA/Container/ainovel/project_templates:/app/project_templates
      - /share/CACHEDEV1_DATA/Container/ainovel/plugins:/app/plugins
    restart: always
